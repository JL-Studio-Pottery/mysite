<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset=\"UTF-8\">
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
    <meta name=\"description\" content=\"Explore the gallery of JL Studio Pottery by Julie LoRusso. Discover unique artisanal ceramics and porcelain works inspired by nature and European antiques.\">

                <div class="gallery-item">
                    <img src="assets/Cache_Pot2.webp"

                         alt="Logo" 
                         class="gallery-image">
                </div>
                <div class="gallery-item">
                    <img src="assets/Email.webp"

                         class="gallery-image">

                <div class="gallery-item">
                    <img src="assets/instagram.svg" 
                         alt="Instagram" 
                         class="gallery-image">
                </div>
            </div>
        </div>

    <!-- Global Footer -->
    <footer class="global-footer">
        <div class="container">
            <div class="footer-content">
                <a href="https://www.instagram.com/jl_pottery/" target="_blank" rel="noopener" class="footer-link">@jl_pottery</a>
                <p class="footer-copyright">© 2024 JL Studio Pottery</p>
